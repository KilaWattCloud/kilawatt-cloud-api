# Bug reports
- name: "bug"
  color: "d73a49"
  description: "Something isn't working"

# Enhancements and features
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

# Documentation
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

# Maintenance
- name: "chore"
  color: "ffc274"
  description: "Maintenance tasks (dependencies, CI/CD, etc.)"

- name: "refactor"
  color: "cccccc"
  description: "Code refactoring without changing behavior"

# Priority
- name: "priority: high"
  color: "ff4444"
  description: "High priority issue"

- name: "priority: low"
  color: "cccccc"
  description: "Low priority issue"

# Status
- name: "status: help wanted"
  color: "159818"
  description: "Help from the community is welcome"

- name: "status: blocked"
  color: "d73a49"
  description: "Work on this is blocked by another issue"

- name: "status: in progress"
  color: "0075ca"
  description: "Work is in progress"

# Type
- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or PR already exists"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
